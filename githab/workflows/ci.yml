name: CI

on: push

jobs:
  codstyle: 
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v2 #git checkout hash-commit
       - uses: actions/setup-node@v4
         with:
           node-version: 24.12.0
           cache: 'npm'
       - run: npm ci
       - run: npm run lint:ci 


test:
  runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
         node-version: 24.12.0
         cache: 'npm'
      - run: npm ci
      - run: npm echo "${{vars.ENV_FILE}}" >> .env
      - run: npm test


